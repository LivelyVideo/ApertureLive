openapi: 3.0.3
info:
  title: Aperture Live Session Configuration API
  version: 1.0.0
  description: >-
    Schema for session configuration used in WHIP (WebRTC), RTMP and SRT
    streaming sessions. The payload is fetched from the URL encoded in the QR code and
    decoded with a strict, camelCase-literal JSON decoder: keys are matched
    exactly as spelled below (no snake_case conversion except where a field is
    explicitly named with underscores), and unknown keys are ignored.

components:
  schemas:
    SessionConfiguration:
      type: object
      description: >-
        Main session configuration received via QR code payload. A payload
        needs at least one ingest endpoint: `whip`, `metadata.rtmpURL` or
        `metadata.srtURL`. When more than one is set, the client streams over
        RTMP first, then SRT, then WHIP. The Android client currently accepts
        only WHIP payloads, and also requires at least one entry in
        `ice_servers` or `stun_urls`.
      anyOf:
        - required: [whip]
        - required: [metadata]
          properties:
            metadata:
              required: [rtmpURL]
        - required: [metadata]
          properties:
            metadata:
              required: [srtURL]
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
          description: >-
            HTTP headers for WHIP requests. Only `Authorization` is consumed by
            the client: a leading "Bearer " prefix is stripped and the remainder
            is used as the session bearer token.
        metadata:
          $ref: '#/components/schemas/Metadata'
        whip:
          type: string
          format: uri
          description: >-
            WHIP endpoint URL for WebRTC ingestion. Must use the `https`
            scheme when present; the client rejects the configuration
            otherwise. Optional on iOS when `metadata.rtmpURL` or
            `metadata.srtURL` is set, in which case it is ignored. Required by
            the Android client.
        stun_urls:
          type: array
          items:
            type: string
          deprecated: true
          description: >-
            "Deprecated: Use ice_servers instead." Only consulted when
            `ice_servers` is absent; each entry becomes a STUN-only ICE server.
        ice_servers:
          type: array
          items:
            $ref: '#/components/schemas/RTCIceServer'
          description: >-
            ICE servers (STUN/TURN) for WebRTC connectivity. Entries that fail
            URL validation are dropped individually rather than failing the
            whole payload.
        ice_transport_policy:
          type: string
          enum: [all, relay]
          description: >-
            ICE transport policy (all or relay-only). Not consumed by the iOS
            client, which always uses `all`.

    Metadata:
      type: object
      properties:
        version:
          type: integer
          default: 1
          description: Schema version
        name:
          type: string
          description: >-
            Display name for the session. When absent, the client falls back to
            `ecs.user.full_name`, then `ecs.user.name`, then an empty string.
        streamName:
          type: string
          description: Stream name reported in logs and the broadcast UI
        platformName:
          type: string
          description: Name of the originating platform, reported in logs
        logUrl:
          type: string
          format: uri
          description: Remote endpoint that receives ECS-formatted client logs
        options:
          $ref: '#/components/schemas/Options'
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/Widget'
          description: Embedded web widgets to display during broadcast
        rtmpURL:
          type: string
          format: uri
          nullable: true
          description: >-
            RTMP ingest URL for RTMP egress to platforms that only accept RTMP
            (e.g. YouTube, Twitch, custom). When present and non-empty, the
            session streams via RTMP instead of WHIP/WebRTC; the transport is
            inferred from the presence of this field. RTMP takes precedence
            over `srtURL` and `whip`, which are ignored when it is set. iOS
            only for now; the Android client doesn't read it.
          example: "rtmp://live.example.com/app"
        rtmpStreamKey:
          type: string
          nullable: true
          description: >-
            RTMP stream key appended to the publish request. Optional; may be
            omitted or empty when the key is embedded in `rtmpURL`. Ignored
            unless `rtmpURL` is present and non-empty.
          example: "sk-test-123"
        srtURL:
          type: string
          format: uri
          nullable: true
          description: >-
            SRT ingest URL. When present and non-empty (and `rtmpURL` is not),
            the session streams via SRT instead of WHIP/WebRTC; `whip` is
            ignored. Must use the `srt://` scheme and include a host; the port
            defaults to 9710. May contain at most one `?`: extra query items
            such as `mode=`, `maxbw=` or `pbkeylen=` are passed through to
            SRT, but the stream ID belongs in `srtStreamKey`, not the URL. iOS
            only for now; the Android client doesn't read it. An invalid SRT
            value (URL, stream ID, passphrase or latency) stops the stream
            from connecting, with an error that names the problem. Unlike
            `options`, a value of the wrong type here (e.g. the string "120"
            for `srtLatencyMs`) fails the whole payload.
          example: "srt://ingest.example.com:9710"
        srtStreamKey:
          type: string
          nullable: true
          description: >-
            Sent to the ingest as the SRT stream ID (`SRTO_STREAMID`), which
            identifies and/or authenticates the publish. Any characters are
            allowed, up to 512 bytes. Ignored unless `srtURL` is in use.
          example: "/live/my-stream?key=abc123"
        srtPassphrase:
          type: string
          nullable: true
          minLength: 10
          maxLength: 79
          description: >-
            AES encryption passphrase, 10–79 characters per the SRT spec. Omit
            it for an unencrypted stream. Ignored unless `srtURL` is in use.
        srtLatencyMs:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            SRT receiver latency budget in milliseconds: the buffer SRT has
            for retransmitting lost packets, traded against glass-to-glass
            latency. Must be greater than 0. Defaults to 120 when omitted.
            Ignored unless `srtURL` is in use.
          example: 120
        srtAdaptiveBitrate:
          type: boolean
          nullable: true
          default: true
          description: >-
            Whether the encoder adjusts its bitrate to SRT's congestion
            signals (round-trip time, loss and send-queue depth). Ignored
            unless `srtURL` is in use.
          example: true
        ecs:
          $ref: '#/components/schemas/ECS'

    Options:
      type: object
      description: >-
        Session options. Integer-typed fields are parsed defensively: a value of
        an unexpected type (e.g. the string "41" for `h264MaxProfileLevel`) is
        logged and dropped instead of failing the whole payload.
      properties:
        pendingValues:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Pending configuration values
        ui:
          $ref: '#/components/schemas/UI'
        fixedEncodingMode:
          type: boolean
          nullable: true
          description: Use fixed resolution/bitrate instead of adaptive
        useCBR:
          type: boolean
          nullable: true
          description: Use constant bitrate encoding
        resolution:
          type: string
          nullable: true
          description: >-
            Video resolution preset. Matched case-insensitively; unrecognized
            values leave the default (720p) in place.
          enum: ["480p", "720p", "1080p", "1440p", "4K"]
          example: "720p"
        audioBitrate:
          type: integer
          nullable: true
          description: Audio bitrate in kbps
          example: 128
        videoBitrate:
          type: integer
          nullable: true
          description: Video bitrate in kbps
          example: 2500
        startBitrate:
          type: integer
          nullable: true
          description: >-
            Initial congestion-controller bitrate in kbps. Applies to the
            WHIP/WebRTC path only.
          example: 1200
        videoCodec:
          type: string
          nullable: true
          description: >-
            Video codec MIME type. Matched case-insensitively; unrecognized
            values leave the default (video/H264) in place.
          example: "video/H264"
          enum: ["video/H264", "video/VP8", "video/VP9"]
        framerate:
          type: integer
          nullable: true
          description: Target framerate in fps
          example: 30
        audioPriorityMode:
          type: string
          nullable: true
          description: >-
            Audio priority mode for bitrate allocation. Matched
            case-insensitively.
          enum: [Balanced, AudioFirst]
          example: "Balanced"
        h264Profile:
          type: integer
          nullable: true
          description: >-
            H.264 profile as its `profile_idc` value, used to build the SDP
            `profile-level-id`. Defaults to Baseline (66) when the codec is
            H.264 and no profile is given. High 10 (101) is not supported by
            iOS VideoToolbox.
          enum: [66, 77, 100, 101]
          example: 66
        h264MaxProfileLevel:
          type: integer
          nullable: true
          description: >-
            Maximum H.264 level as its `level_idc` value (e.g. 40 = Level 4.0),
            which caps the encoded frame size. Defaults to a resolution-aware
            level with a floor of 4.0 when the codec is H.264 and no level is
            given.
          enum: [31, 32, 40, 41, 42, 50, 51, 52]
          example: 40
        lockOrientation:
          type: string
          nullable: true
          description: >-
            Lock the broadcast to a single orientation. Matched
            case-insensitively; unrecognized values leave orientation unlocked.
          enum: [portrait, landscape]
          example: "portrait"
        lockCameraMode:
          type: string
          nullable: true
          description: >-
            Restrict the session to a single camera mode. Matched
            case-insensitively.
          enum: [Telephoto, AR]
          example: "Telephoto"
        defaultCameraFacing:
          type: string
          nullable: true
          description: >-
            Camera to select when the session starts. Matched
            case-insensitively; defaults to World.
          enum: [User, World]
          default: "World"
          example: "World"

    UI:
      type: object
      properties:
        compact:
          type: boolean
          nullable: true
          default: false
          description: Use compact UI layout

    Widget:
      type: object
      description: >-
        A web view embedded in the broadcast UI. Layout is controlled session-
        wide via `metadata.options.ui` — there are no per-widget layout keys.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Widget URL to load
        headers:
          type: object
          additionalProperties:
            type: string
          description: HTTP headers for widget requests
        key:
          type: string
          description: Unique identifier for the widget
        cookies:
          type: array
          items:
            $ref: '#/components/schemas/CookieData'
          description: Cookies to set for the widget

    CookieData:
      type: object
      description: >-
        Cookie to install before loading a widget. Only `name`, `value`,
        `domain`, and `path` are consumed by the client.
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
        domain:
          type: string
        path:
          type: string
        sameSite:
          type: string
          enum: [Strict, Lax, None]
          description: Not consumed by the client
        secure:
          type: boolean
          description: Not consumed by the client

    RTCIceServer:
      type: object
      description: WebRTC ICE server configuration
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
          description: >-
            STUN/TURN server URLs. Must be an array — a bare string fails to
            decode. Entries are validated and invalid servers are dropped.
        username:
          type: string
          description: Username for TURN authentication
        credential:
          type: string
          description: Credential for TURN authentication

    ECS:
      type: object
      description: >-
        Elastic Common Schema logging configuration. Only `user.name` and
        `user.full_name` are consumed by the client; the remaining fields are
        accepted for compatibility and ignored.
      properties:
        user:
          $ref: '#/components/schemas/EcsUser'
        labels:
          $ref: '#/components/schemas/Labels'

    Labels:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/Platform'

    Platform:
      type: object
      properties:
        id:
          type: string
          description: Platform identifier

    EcsUser:
      type: object
      description: ECS User information for logging
      properties:
        domain:
          type: string
          description: Directory domain name (e.g., LDAP/AD)
        email:
          type: string
          format: email
        full_name:
          type: string
          description: >-
            User's full name. Used as the session display name when
            `metadata.name` is absent.
        hash:
          type: string
          description: Anonymized user hash
        id:
          type: string
          description: Unique user identifier
        name:
          type: string
          description: >-
            Short name or login. Used as the session display name when both
            `metadata.name` and `ecs.user.full_name` are absent.
        roles:
          type: array
          items:
            type: string
          description: User roles
